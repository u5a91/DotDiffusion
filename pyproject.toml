[project]
name = "dotdiffusion"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pillow>=12.3.0",
    "pyyaml>=6.0.3",
    "torch>=2.14.0",
    "torchvision>=0.29.0",
    "tqdm>=4.70.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
    "types-pyyaml>=6.0.12.20260815",
    "types-tqdm>=4.70.0.20260827",
]

[[tool.mypy.overrides]]
module = ["torchvision.*"]
ignore_missing_imports = true
